name: CI/CD TP06

on:
  pull_request:
    paths:
      - "03_Trabajos_Practicos/TP06/**"
      - ".github/workflows/cicd.yml"
  push:
    branches:
      - main
    paths:
      - "03_Trabajos_Practicos/TP06/**"
      - ".github/workflows/cicd.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: Operacion a ejecutar
        type: choice
        options:
          - deploy
          - rollback
        default: deploy
        required: true
      artifact_run_id:
        description: ID de una ejecucion exitosa anterior (solo para rollback)
        type: string
        required: false

permissions:
  actions: read
  contents: read

jobs:
  backend-tests:
    name: Backend - instalar dependencias y ejecutar pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_Trabajos_Practicos/TP06/Backend
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 03_Trabajos_Practicos/TP06/Backend/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar pruebas de backend
        run: python -m pytest -v

  frontend-tests:
    name: Frontend - ejecutar tests y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_Trabajos_Practicos/TP06/Frontend
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 03_Trabajos_Practicos/TP06/Frontend/package-lock.json

      - name: Instalar dependencias bloqueadas
        run: npm ci

      - name: Ejecutar pruebas de frontend
        run: npm test

      - name: Generar build de produccion
        run: npm run build

      - name: Guardar build del frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: 03_Trabajos_Practicos/TP06/Frontend/dist/
          if-no-files-found: error
          retention-days: 30

  package:
    name: Empaquetar version validada
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-tests
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Descargar build del frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: release/Frontend/dist

      - name: Preparar paquete versionado
        working-directory: 03_Trabajos_Practicos/TP06
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release/Backend"
          cp -R Backend/app Backend/requirements.txt "$GITHUB_WORKSPACE/release/Backend/"
          printf '{"commit":"%s","run_id":"%s"}\n' "$COMMIT_SHA" "$RUN_ID" > "$GITHUB_WORKSPACE/release/manifest.json"
          cd "$GITHUB_WORKSPACE"
          zip -qr ecoharmony-release.zip release

      - name: Publicar paquete como artefacto inmutable de esta ejecucion
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: ecoharmony-release.zip
          if-no-files-found: error
          retention-days: 30

  deploy-demo:
    name: Deploy a staging (demostrativo)
    runs-on: ubuntu-latest
    needs: package
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy')
    environment: staging
    concurrency:
      group: tp06-staging-deployment
      cancel-in-progress: false
    steps:
      - name: Descargar paquete validado
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: deployment

      - name: Simular despliegue y registrar version
        run: |
          echo "Despliegue demostrativo: no hay un servidor configurado."
          unzip -p deployment/ecoharmony-release.zip release/manifest.json
          sha256sum deployment/ecoharmony-release.zip

  rollback-demo:
    name: Rollback a un paquete anterior (demostrativo)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback'
    environment: staging
    concurrency:
      group: tp06-staging-deployment
      cancel-in-progress: false
    steps:
      - name: Validar ID de ejecucion anterior
        if: inputs.artifact_run_id == ''
        run: |
          echo "::error::Para rollback se requiere el ID de una ejecucion anterior exitosa."
          exit 1

      - name: Descargar paquete anterior validado
        uses: actions/download-artifact@v4
        with:
          name: release-package
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: rollback

      - name: Simular restauracion y registrar version
        run: |
          echo "Rollback demostrativo: se selecciono un paquete de una ejecucion anterior."
          unzip -p rollback/ecoharmony-release.zip release/manifest.json
          sha256sum rollback/ecoharmony-release.zip
